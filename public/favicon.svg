<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f0f23"/>

  <!-- Input to hidden layer connections -->
  <line x1="7" y1="8"  x2="16" y2="10" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="16" x2="16" y2="10" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="24" x2="16" y2="10" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="8"  x2="16" y2="16" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="16" x2="16" y2="16" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="24" x2="16" y2="16" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="8"  x2="16" y2="22" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="16" x2="16" y2="22" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
  <line x1="7" y1="24" x2="16" y2="22" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>

  <!-- Hidden to output layer connections -->
  <line x1="16" y1="10" x2="25" y2="13" stroke="#818cf8" stroke-width="0.8" opacity="0.8"/>
  <line x1="16" y1="16" x2="25" y2="13" stroke="#818cf8" stroke-width="0.8" opacity="0.8"/>
  <line x1="16" y1="22" x2="25" y2="13" stroke="#818cf8" stroke-width="0.8" opacity="0.8"/>
  <line x1="16" y1="10" x2="25" y2="19" stroke="#818cf8" stroke-width="0.8" opacity="0.8"/>
  <line x1="16" y1="16" x2="25" y2="19" stroke="#818cf8" stroke-width="0.8" opacity="0.8"/>
  <line x1="16" y1="22" x2="25" y2="19" stroke="#818cf8" stroke-width="0.8" opacity="0.8"/>

  <!-- Input layer nodes -->
  <circle cx="7"  cy="8"  r="2.5" fill="#6366f1"/>
  <circle cx="7"  cy="16" r="2.5" fill="#6366f1"/>
  <circle cx="7"  cy="24" r="2.5" fill="#6366f1"/>

  <!-- Hidden layer nodes -->
  <circle cx="16" cy="10" r="2.5" fill="#818cf8"/>
  <circle cx="16" cy="16" r="2.5" fill="#818cf8"/>
  <circle cx="16" cy="22" r="2.5" fill="#818cf8"/>

  <!-- Output layer nodes -->
  <circle cx="25" cy="13" r="2.5" fill="#a5b4fc"/>
  <circle cx="25" cy="19" r="2.5" fill="#a5b4fc"/>
</svg>